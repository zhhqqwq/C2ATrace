name: C2ATrace v0.1 conformance preflight

on:
  push:
    paths:
      - "conformance/v0.1/**"
      - "schema/v0.1/**"
      - "fixtures/v0.1/**"
      - "vectors/v0.1/**"
      - "traceability/v0.1/**"
      - ".github/workflows/p5-matcher-coverage-audit.yml"
  pull_request:
    paths:
      - "conformance/v0.1/**"
      - "schema/v0.1/**"
      - "fixtures/v0.1/**"
      - "vectors/v0.1/**"
      - "traceability/v0.1/**"
      - ".github/workflows/p5-matcher-coverage-audit.yml"

permissions:
  contents: read

jobs:
  p5-matcher-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/audit/p5-requirements.txt
      - name: Run P5 matcher coverage audit
        id: audit
        run: |
          set +e
          python conformance/v0.1/audit/p5_matcher_coverage_audit.py --output /tmp/p5-matcher-coverage-audit.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-matcher-coverage-audit
          path: /tmp/p5-matcher-coverage-audit.json
          if-no-files-found: error
      - name: Enforce audit result
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
