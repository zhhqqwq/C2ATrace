name: P5 matcher coverage audit
on:
  push:
    branches:
      - p5-matcher-audit-20261003

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install P5 audit dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/audit/p5-requirements.txt
      - name: Run P5 audit
        id: audit
        run: |
          set +e
          python conformance/v0.1/audit/p5_matcher_coverage_audit.py --output /tmp/p5-matcher-coverage-audit.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload P5 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-matcher-coverage-audit
          path: /tmp/p5-matcher-coverage-audit.json
          if-no-files-found: error
      - name: Enforce audit result
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
