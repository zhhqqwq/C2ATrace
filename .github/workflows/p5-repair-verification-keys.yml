name: P5 repair verification key harnesses

on:
  push:
    branches:
      - p5-matcher-audit-20261003
    paths:
      - .github/workflows/p5-repair-verification-keys.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p5-matcher-audit-20261003
      - name: Repair verification_keys harness materialization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          key = {
              "key_ref": "test-ed25519-key-001",
              "algorithm": "ed25519",
              "public_key_base64url": "A6EHv_POEL4dcN0Y50vAmWfk1jCbpQ1fHdyGZBJVMbg",
          }
          changed = []
          bad = []
          for p in sorted((root / "conformance" / "v0.1" / "cases").rglob("*.json")):
              j = json.loads(p.read_text())
              harness = j.get("harness")
              if not isinstance(harness, dict) or "verification_keys" not in harness:
                  continue
              vals = harness["verification_keys"]
              if not isinstance(vals, list):
                  bad.append((str(p), vals))
                  continue
              new = []
              touched = False
              for v in vals:
                  if isinstance(v, str):
                      if v != key["key_ref"]:
                          bad.append((str(p), v))
                          new.append(v)
                      else:
                          new.append(dict(key))
                          touched = True
                  else:
                      new.append(v)
              if touched:
                  harness["verification_keys"] = new
                  p.write_text(json.dumps(j, indent=2) + "\n")
                  changed.append(str(p))
          if bad:
              raise SystemExit("unexpected verification_keys entries: " + repr(bad))
          if len(changed) != 32:
              raise SystemExit(f"expected exactly 32 repaired cases, got {len(changed)}: {changed}")
          print("\n".join(changed))
          PY
      - name: Install P5 audit dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/audit/p5-requirements.txt
      - name: Run full P5 audit after repair
        run: |
          python conformance/v0.1/audit/p5_matcher_coverage_audit.py --output /tmp/p5-matcher-coverage-audit.json
      - name: Upload P5 audit
        uses: actions/upload-artifact@v4
        with:
          name: p5-matcher-coverage-audit-after-key-repair
          path: /tmp/p5-matcher-coverage-audit.json
          if-no-files-found: error
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conformance/v0.1/cases
          git diff --cached --quiet && { echo "expected repair diff is empty"; exit 1; }
          git commit -m "conformance: materialize verification key harness objects"
          git push origin HEAD:p5-matcher-audit-20261003
