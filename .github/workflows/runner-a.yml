name: C2ATrace runner A

on:
  push:
    paths:
      - "conformance/v0.1/**"
      - "schema/v0.1/**"
      - "fixtures/v0.1/**"
      - "vectors/v0.1/**"
      - ".github/workflows/runner-a.yml"
  pull_request:
    paths:
      - "conformance/v0.1/**"
      - "schema/v0.1/**"
      - "fixtures/v0.1/**"
      - "vectors/v0.1/**"
      - ".github/workflows/runner-a.yml"

permissions:
  contents: read

jobs:
  direct-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runner A dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/runner-a/requirements.txt
      - name: Run independent direct-schema gate
        id: runner
        run: |
          set +e
          python conformance/v0.1/runner-a/runner_a.py \
            --enforcement direct_schema \
            --require-complete \
            --output /tmp/runner-a-direct-schema.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload runner A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-a-direct-schema
          path: /tmp/runner-a-direct-schema.json
          if-no-files-found: error
      - name: Enforce runner A direct-schema gate
        if: steps.runner.outputs.exit_code != '0'
        run: exit 1
