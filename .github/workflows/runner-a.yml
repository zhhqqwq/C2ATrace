name: C2ATrace runner A

on:
  push:
    paths:
      - "conformance/v0.1/**"
      - "schema/v0.1/**"
      - "fixtures/v0.1/**"
      - "vectors/v0.1/**"
      - ".github/workflows/runner-a.yml"
  pull_request:
    paths:
      - "conformance/v0.1/**"
      - "schema/v0.1/**"
      - "fixtures/v0.1/**"
      - "vectors/v0.1/**"
      - ".github/workflows/runner-a.yml"

permissions:
  contents: read

jobs:
  direct-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runner A dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/runner-a/requirements.txt
      - name: Run independent direct-schema gate
        id: runner
        run: |
          set +e
          python conformance/v0.1/runner-a/runner_a.py             --enforcement direct_schema             --require-complete             --output /tmp/runner-a-direct-schema.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload runner A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-a-direct-schema
          path: /tmp/runner-a-direct-schema.json
          if-no-files-found: error
      - name: Enforce runner A direct-schema gate
        if: steps.runner.outputs.exit_code != '0'
        run: exit 1

  deterministic-vector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runner A dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/runner-a/requirements.txt
      - name: Run independent deterministic-vector gate
        id: runner
        run: |
          set +e
          python conformance/v0.1/runner-a/runner_a.py             --enforcement deterministic_vector             --require-complete             --output /tmp/runner-a-deterministic-vector.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload runner A vector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-a-deterministic-vector
          path: /tmp/runner-a-deterministic-vector.json
          if-no-files-found: error
      - name: Enforce runner A deterministic-vector gate
        if: steps.runner.outputs.exit_code != '0'
        run: exit 1

  semantic-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runner A dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/runner-a/requirements.txt
      - name: Run independent semantic foundation gate
        id: runner
        run: |
          set +e
          python conformance/v0.1/runner-a/runner_a.py \
            --primary-primitive prim.ref.local \
            --primary-primitive prim.ref.external \
            --primary-primitive prim.ref.failure \
            --primary-primitive prim.graph.invariants \
            --require-complete \
            --output /tmp/runner-a-semantic-foundation.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload runner A semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-a-semantic-foundation
          path: /tmp/runner-a-semantic-foundation.json
          if-no-files-found: error
      - name: Enforce runner A semantic foundation gate
        if: steps.runner.outputs.exit_code != '0'
        run: exit 1

  semantic-derivation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runner A dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/runner-a/requirements.txt
      - name: Run independent derivation semantic gate
        id: runner
        run: |
          set +e
          python conformance/v0.1/runner-a/runner_a.py \
            --batch-manifest conformance/v0.1/runner-a/batches/wave-03-batch-02-derivation.json \
            --require-complete \
            --output /tmp/runner-a-semantic-derivation.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload runner A derivation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-a-semantic-derivation
          path: /tmp/runner-a-semantic-derivation.json
          if-no-files-found: error
      - name: Enforce runner A derivation semantic gate
        if: steps.runner.outputs.exit_code != '0'
        run: exit 1

  semantic-request-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runner A dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/runner-a/requirements.txt
      - name: Run independent request-binding semantic gate
        id: runner
        run: |
          set +e
          python conformance/v0.1/runner-a/runner_a.py \
            --batch-manifest conformance/v0.1/runner-a/batches/wave-03-batch-03-request-binding.json \
            --require-complete \
            --output /tmp/runner-a-semantic-request-binding.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload runner A request-binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-a-semantic-request-binding
          path: /tmp/runner-a-semantic-request-binding.json
          if-no-files-found: error
      - name: Enforce runner A request-binding semantic gate
        if: steps.runner.outputs.exit_code != '0'
        run: exit 1

  semantic-identity-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runner A dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/v0.1/runner-a/requirements.txt
      - name: Run independent identity-core semantic gate
        id: runner
        run: |
          set +e
          python conformance/v0.1/runner-a/runner_a.py \
            --batch-manifest conformance/v0.1/runner-a/batches/wave-03-batch-04-identity-core.json \
            --require-complete \
            --output /tmp/runner-a-semantic-identity-core.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload runner A identity-core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-a-semantic-identity-core
          path: /tmp/runner-a-semantic-identity-core.json
          if-no-files-found: error
      - name: Enforce runner A identity-core semantic gate
        if: steps.runner.outputs.exit_code != '0'
        run: exit 1
